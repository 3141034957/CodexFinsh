[project]
name = "codex-wecom-notifier"
version = "0.1.0"
description = "Send Codex task-completion notifications through a WeCom AI bot WebSocket connection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wecom-aibot-python-sdk>=1.0.1,<2",
]

[project.scripts]
codex-wecom-hook = "codex_wecom_notifier.hook:main"
codex-wecom-send = "codex_wecom_notifier.sender:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_wecom_notifier"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
